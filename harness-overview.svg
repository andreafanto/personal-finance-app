<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1020" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1520" height="1020" fill="#ffffff"/>
  <text x="760" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">PERSONAL FINANCE APP — PROBLEM-TO-CODE HARNESS</text>

  <!-- legend -->
  <g font-size="12" fill="#1f2937">
    <rect x="40" y="52" width="16" height="16" fill="#bfdbfe" stroke="#1e3a8a"/>
    <text x="62" y="64">skill (interactive)</text>
    <rect x="220" y="52" width="16" height="16" fill="#ddd6fe" stroke="#5b21b6"/>
    <text x="242" y="64">agent (autonomous)</text>
    <rect x="400" y="52" width="16" height="16" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="422" y="64">file / artifact</text>
    <rect x="560" y="52" width="16" height="16" fill="#fecaca" stroke="#b91c1c"/>
    <text x="582" y="64">blocking gate</text>
  </g>

  <!-- Row 1: define-problem -->
  <rect x="40" y="90" width="200" height="60" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="140" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">/define-problem</text>
  <text x="140" y="132" text-anchor="middle" font-size="10" fill="#1e3a8a">Socratic dialogue</text>

  <line x1="240" y1="120" x2="300" y2="120" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="90" width="240" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="420" y="112" text-anchor="middle" font-size="12" fill="#374151">problems/prob-NNN-*.md</text>
  <text x="420" y="128" text-anchor="middle" font-size="12" fill="#374151">+ domain-vision.md</text>

  <line x1="140" y1="150" x2="140" y2="210" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: requirements -->
  <rect x="40" y="210" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="140" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">/requirements</text>
  <text x="140" y="251" text-anchor="middle" font-size="10" fill="#1e3a8a">recallable / resumable</text>
  <text x="140" y="266" text-anchor="middle" font-size="10" fill="#1e3a8a">interview, one problem at a time</text>

  <line x1="240" y1="245" x2="300" y2="245" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="215" width="240" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="420" y="250" text-anchor="middle" font-size="12" fill="#374151">requirements/req-NNN-*.md</text>

  <line x1="140" y1="280" x2="140" y2="340" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3: design-frontend + analyse-legacy feeding architecture -->
  <rect x="40" y="340" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="140" y="363" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">/design-frontend</text>
  <text x="140" y="379" text-anchor="middle" font-size="10" fill="#1e3a8a">screens/flow, grounded</text>
  <text x="140" y="393" text-anchor="middle" font-size="10" fill="#1e3a8a">in a Figma reference</text>

  <rect x="40" y="430" width="200" height="60" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="140" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">/analyse-legacy</text>
  <text x="140" y="471" text-anchor="middle" font-size="10" fill="#1e3a8a">existing system, if any</text>

  <!-- figma input -->
  <rect x="40" y="500" width="200" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="528" text-anchor="middle" font-size="11" fill="#374151">Figma file (external)</text>
  <line x1="140" y1="500" x2="140" y2="410" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="240" y1="375" x2="300" y2="375" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="460" x2="280" y2="460" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="280" y1="460" x2="280" y2="395" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="280" y1="395" x2="300" y2="395" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="345" width="220" height="80" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="410" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">/architecture-session</text>
  <text x="410" y="384" text-anchor="middle" font-size="10" fill="#1e3a8a">re-entrant, amend not restart</text>
  <text x="410" y="399" text-anchor="middle" font-size="10" fill="#1e3a8a">decisions + tradeoffs discussed</text>
  <text x="410" y="414" text-anchor="middle" font-size="10" fill="#1e3a8a">with the user</text>

  <line x1="520" y1="385" x2="580" y2="385" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="580" y="345" width="260" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="710" y="370" text-anchor="middle" font-size="12" fill="#374151">architecture/architecture-documentation.md</text>
  <text x="710" y="388" text-anchor="middle" font-size="12" fill="#374151">architecture/ADRs/adr-NNNN-*.md</text>
  <text x="710" y="406" text-anchor="middle" font-size="12" fill="#374151">architecture/diagrams/</text>

  <line x1="140" y1="410" x2="140" y2="600" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="410" y1="425" x2="410" y2="600" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="140" y1="600" x2="410" y2="600" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 4: generate-tests -->
  <rect x="40" y="610" width="200" height="60" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="140" y="635" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">/generate-tests</text>
  <text x="140" y="651" text-anchor="middle" font-size="10" fill="#1e3a8a">launcher, then reviews draft</text>

  <line x1="240" y1="640" x2="300" y2="640" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="610" width="180" height="60" rx="8" fill="#ddd6fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="390" y="635" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">test-generator</text>
  <text x="390" y="651" text-anchor="middle" font-size="10" fill="#5b21b6">agent</text>

  <line x1="480" y1="640" x2="540" y2="640" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="610" width="200" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="640" y="645" text-anchor="middle" font-size="12" fill="#374151">src/test/java/...</text>

  <line x1="140" y1="670" x2="140" y2="720" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 5: implement -->
  <rect x="40" y="720" width="200" height="60" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="140" y="745" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">/implement</text>
  <text x="140" y="761" text-anchor="middle" font-size="10" fill="#1e3a8a">picks up all open tasks</text>

  <line x1="240" y1="750" x2="300" y2="750" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="720" width="180" height="60" rx="8" fill="#ddd6fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="390" y="745" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">implementer</text>
  <text x="390" y="761" text-anchor="middle" font-size="10" fill="#5b21b6">agent — never edits tests</text>

  <line x1="480" y1="750" x2="540" y2="750" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="540" y="720" width="200" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="640" y="755" text-anchor="middle" font-size="12" fill="#374151">src/main/java/...</text>

  <!-- Figma verification gate, fed by implementation, blocking verify -->
  <line x1="640" y1="780" x2="640" y2="820" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <rect x="480" y="820" width="320" height="70" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="640" y="843" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">/design-frontend — verification mode</text>
  <text x="640" y="859" text-anchor="middle" font-size="10" fill="#7f1d1d">built UI checked against Figma design</text>
  <text x="640" y="874" text-anchor="middle" font-size="10" fill="#7f1d1d">mismatch → design_verified: false, blocks /verify</text>

  <line x1="480" y1="855" x2="240" y2="855" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <line x1="140" y1="780" x2="140" y2="830" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 6: verify -->
  <rect x="40" y="830" width="200" height="70" rx="8" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="140" y="855" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">/verify</text>
  <text x="140" y="871" text-anchor="middle" font-size="10" fill="#1e3a8a">refuses to run if design</text>
  <text x="140" y="885" text-anchor="middle" font-size="10" fill="#1e3a8a">gate above isn't clear</text>

  <line x1="240" y1="865" x2="1000" y2="865" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1000" y="835" width="180" height="60" rx="8" fill="#ddd6fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="1090" y="860" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">verifier</text>
  <text x="1090" y="876" text-anchor="middle" font-size="10" fill="#5b21b6">tests → coverage → gaps</text>

  <line x1="1180" y1="865" x2="1240" y2="865" stroke="#1e3a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1240" y="835" width="240" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1360" y="860" text-anchor="middle" font-size="12" fill="#374151">status: done</text>
  <text x="1360" y="878" text-anchor="middle" font-size="12" fill="#374151">or blocked (with reason)</text>

  <!-- side note: architecture re-entry -->
  <line x1="640" y1="345" x2="1000" y2="345" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1000" y1="345" x2="1000" y2="835" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="1010" y="600" font-size="10" fill="#1e3a8a" writing-mode="tb" transform="rotate(0 1010,600)">architecture-session is re-entered whenever new findings surface</text>

  <!-- state tracking box -->
  <rect x="1080" y="90" width="380" height="200" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1270" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">.harness/ — state tracking</text>
  <text x="1100" y="140" font-size="11" fill="#9a3412">status frontmatter (per problem/requirement):</text>
  <text x="1100" y="157" font-size="10" fill="#9a3412">defined → requirements_gathering →</text>
  <text x="1100" y="172" font-size="10" fill="#9a3412">requirements_ready → architecture_ready →</text>
  <text x="1100" y="187" font-size="10" fill="#9a3412">tests_generated → implementing → verifying → done</text>
  <text x="1100" y="187" font-size="10" fill="#9a3412"></text>
  <text x="1100" y="210" font-size="10" fill="#9a3412">(blocked at any point; design_verified gate for UI items)</text>
  <text x="1100" y="235" font-size="11" fill="#9a3412">rebuild_index.py → backlog.json + PROGRESS.md</text>
  <text x="1100" y="255" font-size="11" fill="#9a3412">SESSION_LOG.md — "resume here" line every session</text>
  <text x="1100" y="278" font-size="11" fill="#9a3412">clean-campsite: index rebuilt, git committed, resume noted</text>
</svg>
